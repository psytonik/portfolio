<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tileGradient" x1="60" y1="20" x2="460" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5c9"/>
    </linearGradient>
    <radialGradient id="tileShine" cx="0.28" cy="0.18" r="0.6">
      <stop offset="0" stop-color="white" stop-opacity="0.38"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="needleShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#04122c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tileGradient)"/>
  <rect width="512" height="512" rx="112" fill="url(#tileShine)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="10" stroke-dasharray="240 250" stroke-linecap="round" transform="rotate(-45 256 256)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="10" stroke-dasharray="150 340" stroke-linecap="round" transform="rotate(135 256 256)"/>
  <g filter="url(#needleShadow)">
    <polygon points="256,96 300,256 256,222 212,256" fill="white"/>
    <polygon points="256,416 300,256 256,290 212,256" fill="rgba(255,255,255,0.32)"/>
  </g>
  <circle cx="256" cy="256" r="22" fill="white"/>
  <circle cx="256" cy="256" r="9" fill="#1450d6"/>
</svg>
